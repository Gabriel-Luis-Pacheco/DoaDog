name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DoaDog
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DoaDog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo dependency check
        run: npx expo install --check

      - name: Expo doctor
        run: npx expo-doctor

      - name: Android export smoke test
        run: npx expo export --platform android --output-dir .expo/ci-export

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doadog_user
          POSTGRES_PASSWORD: doadog_password
          POSTGRES_DB: doadog_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U doadog_user -d doadog_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://doadog_user:doadog_password@localhost:5432/doadog_db?schema=public
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm test

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://doadog_user:doadog_password@localhost:5432/doadog_db?schema=public
          RUN_INTEGRATION_TESTS: '1'
          JWT_SECRET: ci-secret-with-more-than-16-characters
          FRONTEND_URL: http://localhost:8081
          PAYMENT_PROVIDER: mock
          WEBHOOK_SECRET: ci-webhook-secret
        run: npm run test:integration

      - name: Build
        run: npm run build
