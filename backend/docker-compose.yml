services:
  postgres:
    image: postgres:16-alpine
    container_name: doadog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doadog_user
      POSTGRES_PASSWORD: doadog_password
      POSTGRES_DB: doadog_db
    ports:
      - "5432:5432"
    volumes:
      - doadog_postgres_data:/var/lib/postgresql/data

volumes:
  doadog_postgres_data:
