services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    ports:
      - "3333:3333"
    volumes:
      - doadog_uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doadog_user
      POSTGRES_PASSWORD: replace-with-strong-password
      POSTGRES_DB: doadog_db
    volumes:
      - doadog_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  doadog_postgres_data:
  doadog_uploads:
